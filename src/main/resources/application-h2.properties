spring.application.name=GitHubRepoSearch-H2

# H2 In-Memory DataSource configuration for standalone out-of-the-box execution
spring.datasource.url=jdbc:h2:mem:github_repo_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console enabled at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# GitHub API Base URL
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:}
