spring.application.name=GitHubRepoSearch

# Default active profile is 'h2' so the app runs out-of-the-box with zero database setup required.
# To switch to PostgreSQL, set environment variable SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# GitHub API Base URL
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:}
